name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for unresolved merge markers
        run: python scripts/check_merge_markers.py

      - name: Run tests
        run: python -m pytest -q

      - name: Compile sanity check
        run: python -m compileall -q src dashboard

      - name: Ruff checks
        run: ruff check src tests dashboard
